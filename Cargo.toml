[package]
name = "titanium-rune"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "titanium-rune"
test = false
benchmark = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[build-dependencies]
cc = "1.2.60"

[dependencies]
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
limine = "0.6.3"
spin = "0.10.0"
uart_16550 = "0.4.0"
volatile = "0.6.1"
x86_64 = { version = "0.15.4", features = ["instructions"] }
